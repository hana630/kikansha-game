<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きかんしゃ・うんてんしれいしつ</title><style>
:root{font-family:system-ui,'Yu Gothic',Meiryo,sans-serif;color:#173444;background:#eaf2f5}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:16px 14px 45px}.hero{background:#153d50;color:white;border-radius:20px;padding:23px 20px;margin-bottom:16px}.hero h1{margin:4px 0;font-size:clamp(23px,5vw,34px)}.hero small{color:#c1e4ed}.panel{background:white;border-radius:18px;padding:19px;margin:12px 0;box-shadow:0 3px 12px #133e4a13}h2{margin:0 0 12px;font-size:23px}h3{margin:0 0 12px}p{line-height:1.7}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:2px solid #c7d9df;border-radius:18px;padding:20px 12px;min-height:138px;text-align:left;color:#163c4b;font-size:19px;font-weight:800;cursor:pointer}.tile span{display:block;font-size:36px;margin-bottom:9px}.tile small{display:block;font-size:13px;font-weight:500;margin-top:7px}.btn{background:#146b60;color:white;border:0;border-radius:13px;padding:13px 18px;font-size:17px;font-weight:800;cursor:pointer;min-height:48px}.btn.alt{background:#e4eef1;color:#173b49}.btn:disabled{opacity:.45;cursor:default}.btn:focus-visible,.option:focus-visible,.tile:focus-visible{outline:4px solid #f1b544}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .btn{flex:1}.muted{color:#58717c}.badge{display:inline-block;border-radius:100px;background:#e4eef3;padding:5px 12px;font-size:13px;font-weight:700}.question{font-size:clamp(20px,4vw,26px);font-weight:800;line-height:1.65;margin:16px 0}.options{display:grid;gap:10px}.option{border:2px solid #c4d8df;border-radius:14px;background:#fff;padding:16px;text-align:left;font-size:19px;font-weight:700;color:#173c4a;cursor:pointer;min-height:65px}.option.selected{border-color:#126b61;background:#e4f6ed}.option.wrong{border-color:#bc4b40;background:#fff0ec}.option:disabled{cursor:default}.feedback{padding:15px;border-radius:13px;background:#e8f5ed;margin:16px 0;line-height:1.8;font-weight:600}.feedback.bad{background:#fff1e8}.progress{height:11px;background:#dce9ed;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#138577;transition:width .2s}.task{font-size:20px;line-height:1.9;background:#eff5f7;border-radius:14px;padding:17px;margin:15px 0}.task ol{padding-left:1.4em}.task li{margin:9px 0}.note{font-size:14px;color:#59727a}.hidden{display:none!important}.completion{text-align:center;padding:26px 10px}.completion .big{font-size:60px}.nav{margin-top:18px}.train{font-size:54px;text-align:center;margin:12px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices .btn{font-size:16px}@media(max-width:450px){.tile{font-size:16px;padding:14px 10px;min-height:130px}.panel{padding:15px}.option{font-size:17px}}
</style></head><body><main><header class="hero"><small>🚦 きんきゅう うんてんしれい</small><h1>🚂 きかんしゃ・うんてんしれいしつ</h1><div>じけんを かいけつして、きかんしゃを はしらせよう！</div></header><section id="home"><div class="panel"><h2>ミッションを えらぼう！</h2><div class="menu"><button class="tile" data-go="quiz"><span>🚂</span>トラブル はっせい！<small>3たく・○×　ぜん10もん</small></button><button class="tile" data-go="signal"><span>🚦</span>しんごう こしょう<small>たいこ・しんごうカード</small></button><button class="tile" data-go="track"><span>🛤️</span>せんろ こしょう<small>フープで うかいろ</small></button><button class="tile" data-go="vehicle"><span>🔧</span>しゃりょう こしょう<small>リズムあんごう</small></button></div></div><p class="note">※ トラブルクイズはタブレットだけであそべます。ほかの3つは、がっきやフープをつかいます。</p></section><section id="quiz" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><span class="badge" id="qtype"></span><span class="badge" id="qcount"></span></div><div class="progress"><div id="bar"></div></div><div class="train" id="qemoji">🚂</div><div class="question" id="qtext"></div><div class="options" id="options"></div><div id="feedback" aria-live="polite"></div><div class="row nav"><button class="btn alt" id="backHome">メニューへ</button><button class="btn alt" id="resetQuiz">はじめから</button><button class="btn hidden" id="next">つぎの じけん！</button></div></div></section><section id="task" class="hidden"><div class="panel"><div class="badge">きんきゅう しれい！</div><div class="train" id="taskEmoji"></div><h2 id="taskTitle"></h2><p id="taskIntro"></p><div class="task" id="taskSteps"></div><p id="taskRole"></p><div id="doneMsg" class="feedback hidden">🎉 ふっきゅう かんりょう！ きかんしゃ しゅっぱつ！</div><div class="row"><button class="btn alt" id="taskHome">メニューへ</button><button class="btn" id="taskDone">ふっきゅう かんりょう！</button></div></div></section><section id="finish" class="hidden"><div class="panel completion"><div class="big">🎉🚂🎉</div><h2>ぜん10もん かいけつ！</h2><p>きみは きかんしゃの<br><strong>とくべつ うんてんしれいいん！</strong></p><div class="row"><button class="btn" id="again">もういちど ちょうせん</button><button class="btn alt" id="finishHome">メニューへ</button></div></div></section></main><script>
'use strict';
const questions=[
{kind:'3たく',emoji:'🛤️',q:'きかんしゃが はしっていると、せんろに おおきな いわが！ まず どうする？',options:['スピードを あげて とおる','あんぜんに とまって、れんらくする','きかんしゃで いわを おす'],answer:1,explain:'まず きかんしゃを あんぜんに とめて、うんてんしれいに れんらく！ せんろを てんけんしてから うごかすよ。'},
{kind:'3たく',emoji:'⚙️',q:'じょうき きかんしゃの しゃりんが まわる ちからは、どこから くる？',options:['じょうきが ピストンを うごかす','けむりが しゃりんを おす','きてきの おとが しゃりんを まわす'],answer:0,explain:'かまで つくった じょうきが ピストンを おし、その うごきが ぼうを とおして しゃりんに つたわるんだ。'},
{kind:'○×',emoji:'🚦',q:'ポイント（ぶんきき）は、でんしゃが すすむ せんろを きりかえる しくみである。',options:['○','×'],answer:0,explain:'ポイントは せんろの むきを きりかえて、でんしゃの すすむ みちを かえる しくみだよ。'},
{kind:'3たく',emoji:'🛞',q:'さかみちで しゃりんが くるくる まわるのに、きかんしゃが すすまない！ なにが おきた？',options:['しゃりんが くうてん している','しゃりんが おおきく なった','レールが みじかく なった'],answer:0,explain:'しゃりんが レールを しっかり とらえられず、からまわり することを「くうてん」というよ。'},
{kind:'3たく',emoji:'🔗',q:'かしゃとの れんけつきが はずれた！ どうする？',options:['そのまま はしりつづける','てで おさえながら はしる','あんぜんに とめて、てんけんを たのむ'],answer:2,explain:'れんけつきは しゃりょうを つなぐ たいせつな ぶひん。あんぜんを たしかめ、てんけんしてから うごかすよ。'},
{kind:'○×',emoji:'🛞',q:'きかんしゃの しゃりんには、レールから はずれにくくする ための「フランジ」という でっぱりが ある。',options:['○','×'],answer:0,explain:'しゃりんの うちがわに ある フランジが、レールから はずれにくくする やくわりを しているよ。'},
{kind:'3たく',emoji:'💨',q:'じょうき きかんしゃの かまに みずが たりなく なった！ どうする？',options:['そのまま かまを たきつづける','あんぜんに とめて、きまりに そって たいおうする','けむりを もっと だす'],answer:1,explain:'かまの みずが たりないのは とても きけん。むりに うごかさず、きまりに そって たいおうするよ。'},
{kind:'3たく',emoji:'🚦',q:'しんごうが「あか」なのに、せんろは あいている。どうする？',options:['あかでも すすむ','スピードを おとして すすむ','しんごうに したがって とまる'],answer:2,explain:'せんろが あいて みえても、あかしんごうでは すすまない。あんぜんの ための たいせつな きまりだよ。'},
{kind:'○×',emoji:'🛤️',q:'レールの つなぎめや すきまは、いつでも ぜんぶ なくした ほうが よい。',options:['○','×'],answer:1,explain:'レールは あつさで のびちぢみ する。つなぎめには その へんかを かんがえた しくみが あるよ。つなぎめの ない レールも あるんだ。'},
{kind:'3たく',emoji:'🛑',q:'きかんしゃの ブレーキが ききにくい！ うんてんしゅは どうする？',options:['あんぜんを かくほし、きまりに そって きんきゅう たいおうする','もっと はやく はしる','きてきを ならせば なおる'],answer:0,explain:'ブレーキの トラブルは きけん。うんてんしゅは きまりに そって きんきゅう たいおうし、うんてんしれいにも しらせるよ。'}
];
const tasks={signal:{emoji:'🚦',title:'しんごうが こしょう！',intro:'たいこと あか・あおの しんごうカードで、きかんしゃを うごかそう！',steps:['フープを ならべて せんろを つくろう。','あかカード → きかんしゃは ストップ！','あおカード → たいこの おとに あわせて しゅっぱつ！','たいこを はやく・ゆっくり たたいて、はしる はやさを かえよう。'],role:'こうたい ミッション：しれいいんと うんてんしゅを こうたいしよう！'},track:{emoji:'🛤️',title:'せんろに しょうがいぶつ！',intro:'あかい フープの せんろは とおれない！ うかいろを つくろう。',steps:['フープで せんろを つくろう。','あかい フープには はいれない！','ほかの フープを うごかして、うかいろを つくろう。','せんせいが きかんしゃに なって、とおれるか ためそう！'],role:'こうたい ミッション：こんどは せんせいが しょうがいぶつを きめるよ！'},vehicle:{emoji:'🔧',title:'きかんしゃが こしょう！',intro:'ひみつの リズムあんごうで しゅうりしよう！',steps:['せんせいが たいこで リズムを ならすよ。','おなじ リズムを まねして ならそう。','こんどは じぶんで リズムを つくろう。','せんせいが あんごうを まねできたら、しゅうり かんりょう！'],role:'こうたい ミッション：せんせいに むずかしい リズムを だしてみよう！'}};
const $=id=>document.getElementById(id);let index=0,solved=false;
function show(page){for(const id of ['home','quiz','task','finish'])$(id).classList.toggle('hidden',id!==page);window.scrollTo(0,0)}
function startQuiz(){index=0;renderQuiz();show('quiz')}
function renderQuiz(){solved=false;const q=questions[index];$('qtype').textContent=q.kind;$('qcount').textContent=`じけん ${index+1} / ${questions.length}`;$('bar').style.width=(index/questions.length*100)+'%';$('qemoji').textContent=q.emoji;$('qtext').textContent=q.q;$('feedback').innerHTML='';$('next').classList.add('hidden');$('options').replaceChildren();q.options.forEach((s,i)=>{const b=document.createElement('button');b.className='option';b.textContent=(q.kind==='3たく'?`${i+1}. `:'')+s;b.onclick=()=>choose(i);$('options').append(b)})}
function choose(i){if(solved)return;const q=questions[index],correct=i===q.answer;const buttons=[...$('options').children];buttons.forEach((b,j)=>{b.classList.toggle('selected',j===i);b.classList.toggle('wrong',j===i&&!correct)});const f=$('feedback');f.className='feedback'+(correct?'':' bad');f.textContent=correct?'🎉 せいかい！ '+q.explain:'もういちど かんがえてみよう！';if(correct){solved=true;buttons.forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'ぜんもん クリア！':'つぎの じけん！'}}
function startTask(key){const t=tasks[key];$('taskEmoji').textContent=t.emoji;$('taskTitle').textContent=t.title;$('taskIntro').textContent=t.intro;$('taskSteps').replaceChildren();const ol=document.createElement('ol');t.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.append(li)});$('taskSteps').append(ol);$('taskRole').textContent=t.role;$('doneMsg').classList.add('hidden');$('taskDone').disabled=false;show('task')}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='quiz'?startQuiz():startTask(b.dataset.go));$('next').onclick=()=>{if(!solved)return;if(index===questions.length-1){show('finish')}else{index++;renderQuiz();window.scrollTo(0,0)}};$('backHome').onclick=()=>show('home');$('resetQuiz').onclick=startQuiz;$('again').onclick=startQuiz;$('finishHome').onclick=()=>show('home');$('taskHome').onclick=()=>show('home');$('taskDone').onclick=()=>{$('doneMsg').classList.remove('hidden');$('taskDone').disabled=true};
</script></body></html>
